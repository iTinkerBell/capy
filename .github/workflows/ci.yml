name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - pr/**


concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

env:
  GIT_FETCH_JOBS: 8
  NET_RETRY_COUNT: 5
  DEFAULT_BUILD_VARIANT: debug,release
  UBSAN_OPTIONS: "print_stacktrace=1"
  DEBIAN_FRONTEND: "noninteractive"
  TZ: "Europe/London"

jobs:
  # Self-hosted runner selection is disabled to allow re-running individual
  # failed jobs from the GitHub Actions UI. When using dynamic runner selection,
  # the runs-on value depends on this job's output, which isn't available when
  # re-running a subset of jobs.
  #
  # runner-selection:
  #   name: Runner Selection
  #   runs-on: ${{ github.repository_owner == 'boostorg' && fromJSON('[ "self-hosted", "linux", "x64", "ubuntu-latest-aws" ]') || 'ubuntu-latest' }}
  #   outputs:
  #     labelmatrix: ${{ steps.aws_hosted_runners.outputs.labelmatrix }}
  #   steps:
  #     - name: AWS Hosted Runners
  #       id: aws_hosted_runners
  #       uses: cppalliance/aws-hosted-runners@v1.0.0

  build:
    # needs: [ runner-selection ]
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (3 configurations)

          - compiler: "msvc"
            version: "14.42"
            cxxstd: "20"
            latest-cxxstd: "20"
            runs-on: "windows-2022"
            b2-toolset: "msvc-14.4"
            generator: "Visual Studio 17 2022"
            is-latest: true
            name: "MSVC 14.42: C++20"
            shared: false
            build-type: "Release"
            build-cmake: true

          - compiler: "msvc"
            version: "14.34"
            cxxstd: "20"
            latest-cxxstd: "20"
            runs-on: "windows-2022"
            b2-toolset: "msvc-14.3"
            generator: "Visual Studio 17 2022"
            name: "MSVC 14.34: C++20 (shared)"
            shared: true
            build-type: "Release"

          - compiler: "mingw"
            version: "*"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++"
            cc: "gcc"
            runs-on: "windows-2022"
            b2-toolset: "gcc"
            generator: "MinGW Makefiles"
            is-latest: true
            is-earliest: true
            name: "MinGW: C++20"
            shared: false
            build-type: "Release"
            build-cmake: true

          # macOS (2 configurations)

          - compiler: "apple-clang"
            version: "*"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++"
            cc: "clang"
            runs-on: "macos-26"
            b2-toolset: "clang"
            is-latest: true
            name: "Apple-Clang (macOS 26, asan+ubsan): C++20"
            shared: true
            build-type: "RelWithDebInfo"
            asan: true
            ubsan: true

          # Linux GCC (4 configurations)

          - compiler: "gcc"
            version: "15"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++-15"
            cc: "gcc-15"
            runs-on: "ubuntu-latest"
            container: "ubuntu:25.04"
            b2-toolset: "gcc"
            is-latest: true
            name: "GCC 15: C++20"
            shared: true
            build-type: "Release"
            build-cmake: true

          - compiler: "gcc"
            version: "15"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++-15"
            cc: "gcc-15"
            runs-on: "ubuntu-latest"
            container: "ubuntu:25.04"
            b2-toolset: "gcc"
            is-latest: true
            name: "GCC 15: C++20 (asan+ubsan)"
            shared: true
            asan: true
            ubsan: true
            build-type: "RelWithDebInfo"

          - compiler: "gcc"
            version: "12"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++-12"
            cc: "gcc-12"
            runs-on: "ubuntu-latest"
            container: "ubuntu:22.04"
            b2-toolset: "gcc"
            name: "GCC 12: C++20"
            shared: true
            build-type: "Release"

          - compiler: "gcc"
            version: "13"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "g++-13"
            cc: "gcc-13"
            runs-on: "ubuntu-24.04"
            b2-toolset: "gcc"
            name: "GCC 13: C++20 (coverage)"
            shared: false
            coverage: true
            build-type: "Debug"
            cxxflags: "--coverage -fprofile-arcs -ftest-coverage"
            ccflags: "--coverage -fprofile-arcs -ftest-coverage"
            install: "lcov wget unzip"

          # Linux Clang (5 configurations)

          - compiler: "clang"
            version: "20"
            cxxstd: "20,23"
            latest-cxxstd: "23"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20-23"
            shared: true
            build-type: "Release"
            build-cmake: true

          - compiler: "clang"
            version: "20"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20 (asan+ubsan)"
            shared: false
            asan: true
            ubsan: true
            build-type: "RelWithDebInfo"

          - compiler: "clang"
            version: "17"
            cxxstd: "20"
            latest-cxxstd: "20"
            cxx: "clang++-17"
            cc: "clang-17"
            runs-on: "ubuntu-24.04"
            b2-toolset: "clang"
            name: "Clang 17: C++20"
            shared: false
            build-type: "Release"

          - compiler: "clang"
            version: "20"
            cxxstd: "20,23"
            latest-cxxstd: "23"
            cxx: "clang++-20"
            cc: "clang-20"
            runs-on: "ubuntu-latest"
            container: "ubuntu:24.04"
            b2-toolset: "clang"
            is-latest: true
            name: "Clang 20: C++20-23 (x86)"
            shared: false
            x86: true
            build-type: "Release"
            install: "gcc-multilib g++-multilib"

    name: ${{ matrix.name }}
    # Skip self-hosted runner selection for now
    # runs-on: ${{ fromJSON(needs.runner-selection.outputs.labelmatrix)[matrix.runs-on] }}
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.container }}
      options: --privileged

    timeout-minutes: 120

    steps:
      - name: Clone Boost.Capy
        uses: actions/checkout@v4
        with:
          path: capy-root

      # Cache APT archives for containers to avoid re-downloading 297MB of compiler packages
      # Uses workspace path since /var/cache/apt is inside the container (not accessible to actions/cache on host)
      - name: Cache APT Archives (Container)
        uses: actions/cache@v4
        if: ${{ matrix.container != '' }}
        id: cache-apt-archives
        with:
          path: .apt-cache
          key: ${{ matrix.container }}-apt-archives-${{ matrix.compiler }}-${{ matrix.version }}-v4
          restore-keys: |
            ${{ matrix.container }}-apt-archives-${{ matrix.compiler }}-${{ matrix.version }}-
            ${{ matrix.container }}-apt-archives-${{ matrix.compiler }}-
            ${{ matrix.container }}-apt-archives-
          save-always: true

      - name: Restore APT Cache (Container)
        if: ${{ matrix.container != '' }}
        run: |
          echo "=== APT Cache Debug ==="
          echo "Cache hit: ${{ steps.cache-apt-archives.outputs.cache-hit }}"
          echo "Cache key: ${{ matrix.container }}-apt-archives-${{ matrix.compiler }}-${{ matrix.version }}-v4"
          ls -la .apt-cache/ 2>/dev/null || echo ".apt-cache directory does not exist yet"

          # Disable APT auto-clean so .deb files are kept after install
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/99keep-debs
          rm -f /etc/apt/apt.conf.d/docker-clean 2>/dev/null || true

          # Restore cached packages if available
          if [ "${{ steps.cache-apt-archives.outputs.cache-hit }}" = "true" ]; then
            echo "Cache HIT - restoring packages..."
            if [ -d ".apt-cache" ] && [ "$(ls -A .apt-cache/*.deb 2>/dev/null)" ]; then
              mkdir -p /var/cache/apt/archives/partial
              cp .apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
              echo "Restored $(ls -1 /var/cache/apt/archives/*.deb 2>/dev/null | wc -l) .deb files"
            else
              echo "WARNING: Cache hit but .apt-cache is empty!"
            fi
          else
            echo "Cache MISS - packages will be downloaded fresh"
          fi

      - name: Setup C++
        uses: alandefreitas/cpp-actions/setup-cpp@v1.9.0
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
          check-latest: true
          trace-commands: true

      # Setup sccache for CMake builds to speed up compilation
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_DIRECT=false" >> $GITHUB_ENV

      - name: Configure B2 to use sccache
        id: configure-b2-sccache
        shell: bash
        run: |
          # Get sccache path and normalize for B2
          sccache_path=$(which sccache || echo "sccache")
          echo "sccache path (raw): $sccache_path"

          # Get compiler path
          compiler_path="${{ steps.setup-cpp.outputs.cxx || matrix.cxx || 'g++' }}"
          echo "compiler path (raw): $compiler_path"

          # On Windows, convert paths to Windows format and escape backslashes for B2
          if [[ "${{ runner.os }} " == "Windows" ]]; then
            # Convert /c/path to C:\path and escape backslashes
            sccache_path=$(echo "$sccache_path" | sed 's|^/\([a-z]\)/|\U\1:/|' | sed 's|/|\\|g' | sed 's|\\|\\\\|g')
            # Escape backslashes in compiler path for B2
            compiler_path=$(echo "$compiler_path" | sed 's|\\|\\\\|g')
            echo "sccache path (Windows): $sccache_path"
            echo "compiler path (Windows): $compiler_path"
          fi

          # Create user-config.jam in workspace that will be passed to b2-workflow
          # For Windows, this file is added to by "Patch user-config.jam (Windows)" step later
          workspace_root=$(echo "$GITHUB_WORKSPACE" | sed 's/\\/\//g')
          config_file="$workspace_root/user-config-sccache.jam"

          # For GCC
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "using gcc : : \"$sccache_path\" \"$compiler_path\" ;" > "$config_file"
            echo "Configured B2 with sccache for GCC"
          fi

          # For Clang
          if [[ "${{ matrix.compiler }}" == "clang" || "${{ matrix.compiler }}" == "apple-clang" ]]; then
            echo "using clang : : \"$sccache_path\" \"$compiler_path\" ;" > "$config_file"
            echo "Configured B2 with sccache for Clang"
          fi

          # For MinGW
          if [[ "${{ matrix.compiler }}" == "mingw" ]]; then
            echo "using gcc : : \"$sccache_path\" \"$compiler_path\" ;" > "$config_file"
            echo "Configured B2 with sccache for MinGW"
          fi

          # For MSVC (Windows) - will be extended by later step for zlib/brotli
          if [[ "${{ matrix.compiler }}" == "msvc" ]]; then
            # MSVC needs special handling - sccache wraps cl.exe
            echo "using msvc : : : <compiler>\"$sccache_path\" <compiler-arg>cl.exe ;" > "$config_file"
            echo "Configured B2 with sccache for MSVC"
          fi

          echo "=== user-config-sccache.jam contents ==="
          cat "$config_file" || echo "File not found yet"
          echo "user_config_path=$config_file" >> $GITHUB_OUTPUT

      - name: Save APT Cache (Container)
        if: ${{ matrix.container != '' && steps.cache-apt-archives.outputs.cache-hit != 'true' }}
        run: |
          echo "Saving APT packages for future cache..."
          mkdir -p .apt-cache
          deb_count=$(ls -1 /var/cache/apt/archives/*.deb 2>/dev/null | wc -l)
          echo "Available .deb files in /var/cache/apt/archives/: $deb_count"
          cp /var/cache/apt/archives/*.deb .apt-cache/ 2>/dev/null || true
          echo "Cached $(ls -1 .apt-cache/*.deb 2>/dev/null | wc -l) .deb files totaling $(du -sh .apt-cache 2>/dev/null | cut -f1 || echo '0')"

      # Cache APT packages to speed up package installation (Linux only)
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: ${{ startsWith(matrix.runs-on, 'ubuntu') && matrix.container == '' }}
        with:
          packages: build-essential zlib1g-dev libbrotli-dev ${{ matrix.install }}
          version: 1.0

      - name: Install packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.0
        id: package-install
        with:
          apt-get-add-architecture: ${{ matrix.x86 && 'i386' || '' }}
          apt-get: >-
            ${{ matrix.install }}
            build-essential

      - name: Clone Boost
        uses: alandefreitas/cpp-actions/boost-clone@v1.9.0
        id: boost-clone
        with:
          branch: ${{ (github.ref_name == 'master' && github.ref_name) || 'develop' }}
          boost-dir: boost-source
          modules-exclude-paths: ''
          scan-modules-dir: capy-root
          scan-modules-ignore: capy

      - name: Install Packages (Windows)
        uses: alandefreitas/cpp-actions/package-install@v1.9.0
        if: ${{ startsWith(matrix.runs-on, 'windows') }}
        id: package-install-windows
        with:
          vcpkg: zlib brotli
          vcpkg-dir: vcpkg-root
          vcpkg-triplet: ${{ matrix.x86 && 'x86-windows-static' || 'x64-windows' }}

      - name: Patch user-config.jam (Windows)
        id: patch-user-config
        shell: bash
        if: ${{ startsWith(matrix.runs-on, 'windows') }}
        run: |
          set -xe
          home=$(pwd)

          triplet=${{ matrix.x86 && 'x86-windows-static' || 'x64-windows' }}
          addrmdl=${{ matrix.x86 && '32' || '64' }}

          # Append to the sccache user-config.jam created earlier
          config_file="${{ steps.configure-b2-sccache.outputs.user_config_path }}"

          # This is temporary until we move capy/build/brotli.jam to boost/tools/build
          echo "import-search ${home}/boost-root/libs/capy/build ;" | sed 's/\/d\//D:\//g' >> "$config_file"

          echo "using zlib   : : <include>\"${home}/vcpkg-root/installed/${triplet}/include\" <search>\"${home}/vcpkg-root/installed/${triplet}/lib\" <dll-path>\"${home}/vcpkg-root/installed/${triplet}/bin\" <name>zlib : <address-model>${addrmdl} ;" | sed 's/\/d\//D:\//g' >> "$config_file"
          echo "using brotli : : <include>\"${home}/vcpkg-root/installed/${triplet}/include\" <search>\"${home}/vcpkg-root/installed/${triplet}/lib\" <dll-path>\"${home}/vcpkg-root/installed/${triplet}/bin\"            : <address-model>${addrmdl} ;" | sed 's/\/d\//D:\//g' >> "$config_file"

          cat "$config_file"

          toolchain=$(echo "$GITHUB_WORKSPACE/vcpkg-root/scripts/buildsystems/vcpkg.cmake" | sed 's/\/d\//D:\//g' )
          echo "toolchain=${toolchain}" >> $GITHUB_OUTPUT

      - name: ASLR Fix
        if: ${{ startsWith(matrix.runs-on, 'ubuntu' )}}
        run: |
          sysctl vm.mmap_rnd_bits=28

      - name: Patch Boost
        id: patch
        shell: bash
        run: |
          set -xe
          pwd
          ls
          ls -lah boost-source

          # Identify boost module being tested
          module=${GITHUB_REPOSITORY#*/}
          echo "module=$module" >> $GITHUB_OUTPUT

          # Identify GitHub workspace root
          workspace_root=$(echo "$GITHUB_WORKSPACE" | sed 's/\\/\//g')
          echo -E "workspace_root=$workspace_root" >> $GITHUB_OUTPUT

          # Remove module from boost-source
          rm -r "boost-source/libs/$module" || true

          # Copy cached boost-source to an isolated boost-root
          cp -r boost-source boost-root

          # Set boost-root output
          cd boost-root
          boost_root="$(pwd)"
          boost_root=$(echo "$boost_root" | sed 's/\\/\//g')
          echo -E "boost_root=$boost_root" >> $GITHUB_OUTPUT

          # Patch boost-root with workspace module
          cp -r "$workspace_root"/capy-root "libs/$module"

      # Compute cache keys based on boost superproject and submodules
      - name: Compute Boost Hashes for Caching
        id: boost-hashes
        shell: bash
        run: |
          cd boost-root

          # Get boost superproject commit hash
          boost_hash=$(git rev-parse HEAD)
          echo "boost_hash=$boost_hash"
          echo "boost_hash=$boost_hash" >> $GITHUB_OUTPUT

          # Get boost.build submodule hash (needed for b2 executable caching)
          boost_build_hash=$(git -C tools/build rev-parse HEAD 2>/dev/null || echo "none")
          echo "boost_build_hash=$boost_build_hash"
          echo "boost_build_hash=$boost_build_hash" >>$GITHUB_OUTPUT

          # Get hash of all submodules except capy (affects build artifacts)
          # This creates a composite hash of all dependency submodules
          submodules_hash=$(git submodule status | grep -v "libs/capy" | git hash-object --stdin || echo "none")
          echo "submodules_hash=$submodules_hash"
          echo "submodules_hash=$submodules_hash" >> $GITHUB_OUTPUT

      # Cache B2 build artifacts to speed up incremental builds
      # Caches: B2 executable, build artifacts (bin.v2/libs/capy only), and generated headers
      # Cache key uses boost superproject + boost.build hashes for b2 executable
      # and submodules hash for build artifacts
      - name: Cache B2 Build
        uses: actions/cache@v4
        id: cache-b2
        with:
          path: |
            boost-root/b2
            boost-root/b2.exe
            boost-root/bin.v2/libs/capy
            boost-root/boost
          key: ${{ runner.os }}-b2-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-${{ matrix.asan && 'asan' || '' }}${{ matrix.ubsan && 'ubsan' || '' }}-boost-${{ steps.boost-hashes.outputs.boost_hash }}-build-${{ steps.boost-hashes.outputs.boost_build_hash }}-deps-${{ steps.boost-hashes.outputs.submodules_hash }}-capy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-b2-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-${{ matrix.asan && 'asan' || '' }}${{ matrix.ubsan && 'ubsan' || '' }}-boost-${{ steps.boost-hashes.outputs.boost_hash }}-build-${{ steps.boost-hashes.outputs.boost_build_hash }}-deps-${{ steps.boost-hashes.outputs.submodules_hash }}-
            ${{ runner.os }}-b2-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-${{ matrix.asan && 'asan' || '' }}${{ matrix.ubsan && 'ubsan' || '' }}-boost-${{ steps.boost-hashes.outputs.boost_hash }}-build-${{ steps.boost-hashes.outputs.boost_build_hash }}-
            ${{ runner.os }}-b2-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-${{ matrix.asan && 'asan' || '' }}${{ matrix.ubsan && 'ubsan' || '' }}-boost-${{ steps.boost-hashes.outputs.boost_hash }}-
            ${{ runner.os }}-b2-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-

      - name: Boost B2 Workflow
        uses: iTinkerBell/cpp-actions/b2-workflow@skip_boostrap
        if: ${{ !matrix.coverage && !matrix.time-trace }}
        env:
          ASAN_OPTIONS: ${{ ((matrix.compiler == 'apple-clang' || matrix.compiler == 'clang') && 'detect_invalid_pointer_pairs=0:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1') || 'detect_invalid_pointer_pairs=2:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1' }}
        with:
          source-dir: boost-root
          modules: capy
          toolset: ${{ matrix.b2-toolset }}
          build-variant: ${{ matrix.build-type }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx || '' }}
          cxxstd: ${{ matrix.cxxstd }}
          address-model: ${{ (matrix.x86 && '32') || '64' }}
          asan: ${{ matrix.asan }}
          ubsan: ${{ matrix.ubsan }}
          shared: ${{ matrix.shared }}
          rtti: on
          cxxflags: ${{ (matrix.asan && '-fsanitize-address-use-after-scope -fsanitize=pointer-subtract') || '' }}
          user-config: ${{ steps.configure-b2-sccache.outputs.user_config_path }}
          stop-on-error: true
          extra-args: ${{ (matrix.valgrind && 'testing.launcher=valgrind' || '' )}}

      # Cache CMake build artifacts
      - name: Cache CMake Build
        uses: actions/cache@v4
        if: ${{ matrix.coverage || matrix.time-trace || matrix.build-cmake || matrix.is-earliest }}
        id: cache-cmake
        with:
          path: __build_cmake_test__
          key: ${{ runner.os }}-cmake-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-${{ hashFiles('capy-root/src/**', 'capy-root/include/**', 'capy-root/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.latest-cxxstd }}-${{ matrix.build-type }}-
            ${{ runner.os }}-cmake-${{ matrix.compiler }}-${{ matrix.version }}-
          save-always: true

      - name: Boost CMake Workflow
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.0
        if: ${{ matrix.coverage || matrix.time-trace || matrix.build-cmake || matrix.is-earliest }}
        with:
          source-dir: boost-root
          build-dir: __build_cmake_test__
          generator: ${{ matrix.generator }}
          generator-toolset: ${{ matrix.generator-toolset }}
          build-type: ${{ matrix.build-type }}
          build-target: tests
          run-tests: true
          install-prefix: .local
          cxxstd: ${{ matrix.latest-cxxstd }}
          cc:  ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ matrix.cxxflags }}
          shared: ${{ matrix.shared }}
          cmake-version: '>=3.20'
          extra-args: |
            -D Boost_VERBOSE=ON
            -D BOOST_INCLUDE_LIBRARIES="${{ steps.patch.outputs.module }}"
            -D CMAKE_C_COMPILER_LAUNCHER=sccache
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache
          export-compile-commands: ${{ matrix.time-trace }}
          package: false
          package-artifact: false
          ref-source-dir: boost-root/libs/capy

      - name: Set Path
        if: startsWith(matrix.runs-on, 'windows') && matrix.shared
        run: echo "$GITHUB_WORKSPACE/.local/bin" >> $GITHUB_PATH

      - name: Set LD_LIBRARY_PATH
        if: startsWith(matrix.runs-on, 'ubuntu') && matrix.shared
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.local/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Only run CMake integration tests on latest/primary configurations to save time
      - name: Find Package Integration Workflow
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.0
        if: ${{ matrix.is-latest && matrix.build-cmake }}
        with:
          source-dir: boost-root/libs/${{ steps.patch.outputs.module }}/test/cmake_test
          build-dir: __build_cmake_install_test__
          generator: ${{ matrix.generator }}
          generator-toolset: ${{ matrix.generator-toolset }}
          build-type: ${{ matrix.build-type }}
          cxxstd: ${{ matrix.latest-cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ matrix.cxxflags }}
          shared: ${{ matrix.shared }}
          install: false
          cmake-version: '>=3.15'
          extra-args: |
            -D BOOST_CI_INSTALL_TEST=ON
            -D CMAKE_PREFIX_PATH=${{ steps.patch.outputs.workspace_root }}/.local
            -D CMAKE_C_COMPILER_LAUNCHER=sccache
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache
          ref-source-dir: boost-root/libs/capy
          trace-commands: true

      - name: Subdirectory Integration Workflow
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.0
        if: ${{ matrix.is-latest && matrix.build-cmake }}
        with:
          source-dir: boost-root/libs/${{ steps.patch.outputs.module }}/test/cmake_test
          build-dir: __build_cmake_subdir_test__
          generator: ${{ matrix.generator }}
          generator-toolset: ${{ matrix.generator-toolset }}
          build-type: ${{ matrix.build-type }}
          cxxstd: ${{ matrix.latest-cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ matrix.cxxflags }}
          shared: ${{ matrix.shared }}
          install: false
          cmake-version: '>=3.15'
          extra-args: |
            -D BOOST_CI_INSTALL_TEST=OFF
            -D CMAKE_C_COMPILER_LAUNCHER=sccache
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache
          ref-source-dir: boost-root/libs/capy/test/cmake_test

      - name: Root Project CMake Workflow
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.0
        if: ${{ matrix.is-latest && matrix.build-cmake }}
        with:
          source-dir: boost-root/libs/${{ steps.patch.outputs.module }}
          build-dir: __build_root_test__
          build-target: tests
          run-tests: true
          generator: ${{ matrix.generator }}
          generator-toolset: ${{ matrix.generator-toolset }}
          build-type: ${{ matrix.build-type }}
          install: false
          cxxstd: ${{ matrix.latest-cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          ccflags: ${{ matrix.ccflags }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          cxxflags: ${{ matrix.cxxflags }}
          shared: ${{ matrix.shared }}
          cmake-version: '>=3.20'
          extra-args: |
            -D CMAKE_C_COMPILER_LAUNCHER=sccache
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache
          package: false
          package-artifact: false
          ref-source-dir: boost-root

      - name: FlameGraph
        uses: alandefreitas/cpp-actions/flamegraph@v1.9.0
        if: matrix.time-trace
        with:
          source-dir: boost-root/libs/capy
          build-dir: boost-root/__build_cmake_test__
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Codecov
        if: ${{ matrix.coverage }}
        run: |
          set -x

          # Generate report
          gcov_tool="gcov"
          if command -v "gcov-${{ steps.setup-cpp.outputs.version-major }}.${{ steps.setup-cpp.outputs.version-minor }}" &> /dev/null; then
              gcov_tool="gcov"
          elif command -v "gcov-${{ steps.setup-cpp.outputs.version-major }}" &> /dev/null; then
              gcov_tool="gcov-${{ steps.setup-cpp.outputs.version-major }}"
          fi
          lcov -c -q -o "boost-root/__build_cmake_test__/coverage.info" -d "boost-root/__build_cmake_test__" --include "$(pwd)/boost-root/libs/${{steps.patch.outputs.module}}/*" --gcov-tool "$gcov_tool"

          # Upload to codecov
          bash <(curl -s https://codecov.io/bash) -f "boost-root/__build_cmake_test__/coverage.info"

          # Summary
          echo "# Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[![codecov](https://codecov.io/github/$GITHUB_REPOSITORY/commit/$GITHUB_SHA/graphs/sunburst.svg)](https://codecov.io/github/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: [![codecov](https://codecov.io/github/$GITHUB_REPOSITORY/commit/$GITHUB_SHA/graph/badge.svg)](https://codecov.io/github/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: [![codecov](https://codecov.io/github/$GITHUB_REPOSITORY/branch/$GITHUB_REF_NAME/graph/badge.svg)](https://codecov.io/github/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  changelog:
    # needs: [ runner-selection ]
    defaults:
      run:
        shell: bash

    name: Changelog Summary
    # Skip self-hosted runner selection for now
    # runs-on: ${{ fromJSON(needs.runner-selection.outputs.labelmatrix)['ubuntu-22.04'] }}
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 120

    steps:
      - name: Clone Boost.Capy
        uses: actions/checkout@v4
        with:
          # Avoid the common API rate limit exceeded error in boostorg by including 100 latest commits in any case
          fetch-depth: 100

      - name: Changelog
        uses: alandefreitas/cpp-actions/create-changelog@v1.9.0
        with:
          thank-non-regular: ${{ startsWith(github.ref, 'refs/tags/') }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          limit: 200
          tag-pattern: 'boost-.*\..*\..*'

  antora:
    # needs: [ runner-selection ]
    name: Antora Docs
    # Skip self-hosted runner selection for now
    # runs-on: ${{ fromJSON(needs.runner-selection.outputs.labelmatrix)['ubuntu-latest'] }}
    runs-on: 'ubuntu-latest'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.0
        with:
          apt-get: git cmake

      - name: Clone Boost.Capy
        uses: actions/checkout@v4
        with:
          path: capy-root

      - name: Clone Boost
        uses: alandefreitas/cpp-actions/boost-clone@v1.9.0
        id: boost-clone
        with:
          branch: ${{ (github.ref_name == 'master' && github.ref_name) || 'develop' }}
          boost-dir: boost-source
          modules-exclude-paths: ''
          scan-modules-dir: capy-root
          scan-modules-ignore: capy

      - name: Patch Boost
        id: patch
        shell: bash
        run: |
          set -xe
          pwd
          ls
          ls -lah boost-source

          # Identify boost module being tested
          module=${GITHUB_REPOSITORY#*/}
          echo "module=$module" >> $GITHUB_OUTPUT

          # Identify GitHub workspace root
          workspace_root=$(echo "$GITHUB_WORKSPACE" | sed 's/\\/\//g')
          echo -E "workspace_root=$workspace_root" >> $GITHUB_OUTPUT

          # Remove module from boost-source
          rm -r "boost-source/libs/$module" || true

          # Copy cached boost-source to an isolated boost-root
          cp -r boost-source boost-root

          # Set boost-root output
          cd boost-root
          boost_root="$(pwd)"
          boost_root=$(echo "$boost_root" | sed 's/\\/\//g')
          echo -E "boost_root=$boost_root" >> $GITHUB_OUTPUT

          # Patch boost-root with workspace module
          cp -r "$workspace_root"/capy-root "libs/$module"

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Cache npm dependencies for Antora build
      - name: Cache npm
        uses: actions/cache@v4
        id: cache-npm-antora
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-antora-${{ hashFiles('capy-root/doc/package-lock.json', 'capy-root/doc/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-antora-
            ${{ runner.os }}-npm-

      - name: Build Antora Docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$(pwd)"

          BOOST_SRC_DIR="$(pwd)/boost-root"
          export BOOST_SRC_DIR
          cd boost-root/libs/capy

          cd doc
          bash ./build_antora.sh

          # Antora returns zero even if it fails, so we check if the site directory exists
          if [ ! -d "build/site" ]; then
              echo "Antora build failed"
              exit 1
          fi

      - name: Create Antora Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antora-docs
          path: boost-root/libs/capy/doc/build/site
